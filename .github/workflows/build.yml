name: Build and server GameTests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Asset integrity
        run: python3 scripts/check_resources.py
      - name: Build and core regression tests
        run: ./gradlew build
      - name: Minecraft server GameTests
        run: ./gradlew runGameTestServer
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            build/libs/*.jar
            run-gametest/logs/
          if-no-files-found: ignore
